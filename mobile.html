<!doctype html>
<html lang="en-us">
  <head>
<script src="coi-serviceworker.min.js"></script>
<meta charset="utf-8">
<!-- Open SoC Explorer: head of mobile.html, the phone version (added by
     web/prepare_site.py to Qt's loader page, after coi-serviceworker, which
     prepare_site.py inserts as the first script: do not include it here). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  // This page always runs the phone user interface: the application reads
  // the "ui" query parameter (src/platform/uimode.cpp).
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get("ui") !== "mobile") {
      params.set("ui", "mobile");
      window.history.replaceState(null, "", window.location.pathname + "?" +
                                  params.toString() + window.location.hash);
    }
  })();
</script>
<style>
  /* The page itself never scrolls or zooms: the application fills the
     screen and scrolls its own pages by touch. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0d1220; color: #e7edff;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  body { position: fixed; inset: 0; }
  #screen {
    position: fixed !important; left: 0; top: 0;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; overscroll-behavior: none;
  }
  #qtspinner { margin: 0; padding-top: 10vh; color: #97a4c5;
               font: 15px/1.5 system-ui, sans-serif; }
  #qtspinner img { width: 160px; height: 100px; margin: 0 auto; }
  #osx-mobile-loading {
    position: fixed; left: 16px; right: 16px; bottom: 24px;
    padding: 12px 14px; border-radius: 14px; border: 1px solid #2a3858;
    background: #131a2d; color: #e7edff; text-align: center;
    font: 15px/1.45 system-ui, sans-serif; pointer-events: none;
  }
  #osx-mobile-loading b { color: #38c6ff; }
</style>

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <title>Open SoC Explorer</title>
    <style>
      /* Make the html body cover the entire (visual) viewport with no scroll bars. */
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #screen { width: 100%; height: 100%; }
    </style>
  </head>
  <body onload="init()">
<!-- Open SoC Explorer: loading note of mobile.html (removed when the
     application shows its screen). -->
<div id="osx-mobile-loading"><b>Open SoC Explorer</b> &middot; phone version<br>
Loading the simulator&hellip; the first start can take a while.<br>
正在加载模拟器，首次打开较慢，请稍候。</div>
<script>
  (function () {
    var timer = setInterval(function () {
      var screen = document.getElementById("screen");
      var note = document.getElementById("osx-mobile-loading");
      if (!note) { clearInterval(timer); return; }
      if (screen && screen.style.display === "block") {
        note.remove();
        clearInterval(timer);
      }
    }, 300);
  })();
</script>

    <figure style="overflow:visible;" id="qtspinner">
      <center style="margin-top:1.5em; line-height:150%">
        <img src="qtlogo.svg" width="320" height="200" style="display:block"></img>
        <strong>Qt for WebAssembly: Ripes</strong>
        <div id="qtstatus"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>
    <div id="screen"></div>

    <script type="text/javascript">
        async function init()
        {
            const spinner = document.querySelector('#qtspinner');
            const screen = document.querySelector('#screen');
            const status = document.querySelector('#qtstatus');

            const showUi = (ui) => {
                [spinner, screen].forEach(element => element.style.display = 'none');
                if (screen === ui)
                    screen.style.position = 'default';
                ui.style.display = 'block';
            }

            try {
                showUi(spinner);
                status.innerHTML = 'Loading...';

                const instance = await qtLoad({
                    qt: {
                        onLoaded: () => showUi(screen),
                        onExit: exitData =>
                        {
                            status.innerHTML = 'Application exit';
                            status.innerHTML +=
                                exitData.code !== undefined ? ` with code ${exitData.code}` : '';
                            status.innerHTML +=
                                exitData.text !== undefined ? ` (${exitData.text})` : '';
                            showUi(spinner);
                        },
                        entryFunction: window.Ripes_entry,
                        containerElements: [screen],
                        
                    }
                });
            } catch (e) {
                console.error(e);
                console.error(e.stack);
            }
        }
    </script>
    <script src="Ripes.js"></script>
    <script type="text/javascript" src="qtloader.js"></script>
  </body>
</html>
